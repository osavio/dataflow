services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
    image: dataflow:dev
    deploy:
      replicas: 2                  # duas instâncias do PHP-FPM
    volumes:
      - .:/var/www/html
    depends_on:
      db-primary:
        condition: service_healthy
      db-replica-1:
        condition: service_healthy
      db-replica-2:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  nginx:                           # porta de entrada + load balancer
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:                          # consome a fila do RabbitMQ
    image: dataflow:dev
    command: php artisan queue:work rabbitmq --tries=3 --timeout=300
    volumes:
      - .:/var/www/html
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-primary:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:                        # broker de mensagens + painel web
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"              # painel: http://localhost:15672
    volumes:
      - dados_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-primary:                      # ÚNICO banco de escrita
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "hot_standby=on"]
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - dados_pg_primary:/var/lib/postgresql/data
      - ./docker/postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      # -h 127.0.0.1 testa pela rede, evitando "ok" falso durante a inicialização
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-replica-1:                    # leitura
    image: postgres:17-alpine
    entrypoint: ["sh", "/scripts/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - dados_pg_replica_1:/var/lib/postgresql/data
      - ./docker/postgres/replica/entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-replica-2:                    # leitura
    image: postgres:17-alpine
    entrypoint: ["sh", "/scripts/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - dados_pg_replica_2:/var/lib/postgresql/data
      - ./docker/postgres/replica/entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:                           # armazenamento de arquivos (compatível com S3)
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"                # painel web: http://localhost:9001
    volumes:
      - dados_minio:/data

  minio-init:                      # cria o bucket automaticamente e termina
    image: minio/mc
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_BUCKET: ${AWS_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${AWS_BUCKET};
      "

volumes:
  dados_pg_primary:
  dados_pg_replica_1:
  dados_pg_replica_2:
  dados_rabbitmq:
  dados_minio: