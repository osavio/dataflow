services:
  app:                             # PHP-FPM + Laravel
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
    image: dataflow:dev
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  nginx:                           # porta de entrada
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:                          # consome a fila do RabbitMQ
    image: dataflow:dev
    command: php artisan queue:work rabbitmq --tries=3 --timeout=300
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:                              # PostgreSQL
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:                        # broker de mensagens + painel web
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"              # painel: http://localhost:15672
    volumes:
      - dados_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:                          # armazenamento de arquivos (compatível com S3)
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9001:9001"                # console web: http://localhost:9001
    volumes:
      - dados_rustfs:/data

  rustfs-init:                     # cria o bucket automaticamente e termina
    image: amazon/aws-cli
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_BUCKET: ${AWS_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3api list-buckets > /dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $${AWS_BUCKET} > /dev/null 2>&1
      || aws --endpoint-url http://rustfs:9000 s3 mb s3://$${AWS_BUCKET};
      "

volumes:
  dados_pg:
  dados_rabbitmq:
  dados_rustfs: