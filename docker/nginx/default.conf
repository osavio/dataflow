# DNS interno do Docker: o Nginx re-resolve o nome "app" a cada 10s,
# descobrindo todas as réplicas e IPs novos quando um container reinicia.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Usar variável força a resolução de DNS a cada uso.
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }
}